<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیپارتمنت روانشناسی افغانستان - مراجع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Vazirmatn', sans-serif; background: #111; color: white; overflow: hidden; }
    .breath-circle { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; background: rgba(34, 197, 94, 0.15); border: 4px solid #22c55e; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: breathe 8s infinite ease-in-out; display: none; z-index: 100; pointer-events: none; box-shadow: 0 0 60px rgba(34,197,94,0.2); }
    @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; } 50% { transform: translate(-50%, -50%) scale(2.5); opacity: 0.1; } }
    #whiteboard { background: #fff; cursor: crosshair; touch-action: none; } 
    .emotion-btn { font-size: 1.5rem; transition: transform 0.2s; } .emotion-btn:active { transform: scale(1.5); }
    input[type=range] { direction: ltr; }</style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- فرم ورود -->
    <div id="intakeForm" class="absolute inset-0 bg-slate-900 p-4 flex flex-col justify-center items-center z-50">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-4 text-emerald-400">دیپارتمنت روانشناسی افغانستان</h2>
            <input type="text" id="pName" placeholder="نام خود را وارد کنید" class="w-full bg-slate-700 text-white p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="patientSubmit()" class="w-full bg-emerald-600 text-white p-3 rounded font-bold">ورود به جلسه</button>
        </div>
    </div>

    <!-- جلسه -->
    <div id="mainSession" class="hidden flex-1 flex flex-col relative h-full">
        <div class="h-12 bg-slate-900/90 flex justify-center items-center z-20"><span class="text-sm text-slate-400">اتصال با دکتر</span></div>

        <div class="flex-1 relative bg-black">
            <!-- ویدیو -->
            <div id="tabVideo" class="absolute inset-0">
                <video id="remoteVideo" autoplay playsinline class="w-full h-full object-contain"></video>
                <div class="absolute top-4 right-4 w-24 h-32 bg-black rounded-lg border border-slate-600 overflow-hidden">
                    <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
                </div>
                <!-- ابزارها -->
                <div id="patientTools" class="absolute bottom-4 left-4 right-4 bg-slate-800/90 backdrop-blur p-3 rounded-xl border border-slate-700">
                    <div class="space-y-3">
                        <div>
                            <div class="flex justify-between text-xs text-slate-300 mb-1"><span>میزان استرس</span><span id="sudsValue">5</span></div>
                            <input type="range" min="0" max="10" value="5" class="w-full accent-emerald-500" oninput="updateSuds(this.value)">
                        </div>
                        <div class="flex justify-between text-lg">
                            <button class="emotion-btn" onclick="sendEmotion('😐')">😐</button>
                            <button class="emotion-btn" onclick="sendEmotion('😢')">😢</button>
                            <button class="emotion-btn" onclick="sendEmotion('😠')">😠</button>
                            <button class="emotion-btn" onclick="sendEmotion('😨')">😨</button>
                            <button class="emotion-btn" onclick="sendEmotion('😊')">😊</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تخته -->
            <div id="tabWhiteboard" class="hidden absolute inset-0 bg-white">
                <div class="h-12 bg-slate-100 flex items-center justify-center border-b"><span class="text-slate-500 text-xs">تخته آموزشی دکتر</span></div>
                <canvas id="whiteboard" class="w-full h-full"></canvas>
                <!-- رنگ‌ها -->
                <div class="absolute bottom-4 right-4 bg-white shadow-lg p-2 rounded-full flex gap-2 border">
                    <div class="w-8 h-8 rounded-full bg-black cursor-pointer" onclick="setColor('black')"></div>
                    <div class="w-8 h-8 rounded-full bg-red-500 cursor-pointer" onclick="setColor('#ef4444')"></div>
                    <div class="w-8 h-8 rounded-full bg-blue-500 cursor-pointer" onclick="setColor('#3b82f6')"></div>
                </div>
            </div>

            <!-- تب آموزش -->
            <div id="tabEducation" class="hidden absolute inset-0 bg-slate-900 flex flex-col p-4 overflow-y-auto">
                <div class="bg-slate-800 rounded-2xl p-6 border border-emerald-500/30 mb-4">
                    <h2 class="text-2xl font-bold text-emerald-400 mb-2" id="eduTitle">...</h2>
                    <p class="text-lg leading-8 text-slate-200 whitespace-pre-line" id="eduContent">در انتظار محتوای آموزشی از دکتر...</p>
                </div>
                <button onclick="copyEducation()" class="w-full bg-slate-700 text-white py-4 rounded-xl font-bold border border-slate-600 flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i> کپی متن برای ذخیره
                </button>
            </div>

            <!-- تب فیلم (جديد) -->
            <div id="tabVideoPlayer" class="hidden absolute inset-0 bg-black flex flex-col p-4">
                <div class="flex-1 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-center relative overflow-hidden">
                    <iframe id="patientVideoFrame" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                </div>
                <p class="text-center text-slate-400 mt-2 text-sm">ویدیوی ارسالی توسط دکتر</p>
            </div>

            <div id="breathOverlay" class="breath-circle flex items-center justify-center">
                <div class="text-center"><span class="text-white text-3xl font-bold animate-pulse block">دم و بازدم</span><span class="text-emerald-400 text-sm block mt-2">با سرعت دایره نفس بکشید</span></div>
            </div>
        </div>

        <div class="h-20 bg-slate-900 flex justify-center items-center gap-6 pb-2 border-t border-slate-800 z-20">
            <button onclick="toggleAudio()" id="btnMic" class="w-14 h-14 rounded-full bg-slate-700 text-white flex items-center justify-center text-xl"><i class="fa-solid fa-microphone"></i></button>
            <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-600 text-white flex items-center justify-center text-2xl"><i class="fa-solid fa-phone-slash"></i></button>
            <button onclick="toggleVideo()" id="btnCam" class="w-14 h-14 rounded-full bg-slate-700 text-white flex items-center justify-center text-xl"><i class="fa-solid fa-video"></i></button>
        </div>
    </div>

    <script>
        let peer = null, conn = null, call = null, localStream = null;
        let canvas = document.getElementById('whiteboard'), ctx = canvas.getContext('2d');
        let isDrawing = false, lastX = 0, lastY = 0, currentColor = 'black';

        function patientSubmit() {
            const name = document.getElementById('pName').value;
            const docId = prompt("کد جلسه دکتر را وارد کنید:");
            if(!docId) return location.reload();
            document.getElementById('intakeForm').innerHTML = '<div class="text-emerald-500 text-xl animate-pulse">در حال اتصال...</div>';
            initCamera().then(() => {
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(docId);
                    conn.on('data', handleData);
                    conn.on('open', () => {
                        conn.send({ type: 'intake', name: name || 'بیمار' });
                        call = peer.call(docId, localStream);
                        handleCall(call);
                    });
                });
                peer.on('error', () => alert("خطا در اتصال"));
            });
        }

        function handleData(data) {
            if (data.type === 'draw') drawRemote(data);
            else if (data.type === 'cmd') executeCmd(data.action);
            else if (data.type === 'education') {
                document.getElementById('eduTitle').innerText = data.title;
                document.getElementById('eduContent').innerText = data.content;
                executeCmd('education');
            } else if (data.type === 'video') {
                document.getElementById('patientVideoFrame').src = data.url;
                executeCmd('videoPlayer');
            }
        }

        function handleCall(c) {
            call = c;
            document.getElementById('intakeForm').classList.add('hidden');
            document.getElementById('mainSession').classList.remove('hidden');
            c.on('stream', s => document.getElementById('remoteVideo').srcObject = s);
            c.on('close', () => location.reload());
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        }

        function executeCmd(action) {
            document.getElementById('tabVideo').classList.add('hidden');
            document.getElementById('tabWhiteboard').classList.add('hidden');
            document.getElementById('tabEducation').classList.add('hidden');
            document.getElementById('tabVideoPlayer').classList.add('hidden');
            document.getElementById('breathOverlay').style.display = 'none';

            if(action === 'video') document.getElementById('tabVideo').classList.remove('hidden');
            if(action === 'whiteboard') {
                document.getElementById('tabWhiteboard').classList.remove('hidden');
                setTimeout(resizeCanvas, 50); // تاخیر برای لود شدن درست
            }
            if(action === 'education') document.getElementById('tabEducation').classList.remove('hidden');
            if(action === 'videoPlayer') document.getElementById('tabVideoPlayer').classList.remove('hidden');
            if(action === 'breath') document.getElementById('breathOverlay').style.display = 'flex';
        }

        function copyEducation() {
            const text = document.getElementById('eduTitle').innerText + "\n" + document.getElementById('eduContent').innerText;
            navigator.clipboard.writeText(text).then(() => alert("متن کپی شد. می‌توانید در یادداشت‌های گوشی خود پیست کنید."));
        }

        // --- ابزارها ---
        function updateSuds(val) { document.getElementById('sudsValue').innerText = val; if(conn && conn.open) conn.send({ type: 'suds', val: val }); }
        function sendEmotion(emoji) { if(conn && conn.open) conn.send({ type: 'emotion', val: emoji }); }
        function resizeCanvas() { const p = canvas.parentElement; canvas.width = p.clientWidth; canvas.height = p.clientHeight; }
        function getPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }; }
        function startDraw(e) { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
        function moveDraw(e) { if(!isDrawing) return; e.preventDefault(); const p = getPos(e); draw(lastX, lastY, p.x, p.y, true); lastX = p.x; lastY = p.y; }
        function endDraw() { isDrawing = false; }
        function draw(x0, y0, x1, y1, isLocal) {
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.strokeStyle = currentColor; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
            if(isLocal && conn && conn.open) conn.send({ type: 'draw', x0, y0, x1, y1, color: currentColor });
        }
        function drawRemote(d) { draw(d.x0, d.y0, d.x1, d.y1, false); }
        function setColor(c) { currentColor = c; }
        canvas.addEventListener('touchstart', startDraw); canvas.addEventListener('touchmove', moveDraw); canvas.addEventListener('touchend', endDraw);

        async function initCamera() { try { localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('localVideo').srcObject = localStream; } catch(e){} }
        function toggleAudio() { localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; document.getElementById('btnMic').innerHTML = localStream.getAudioTracks()[0].enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash text-red-500"></i>'; }
        function toggleVideo() { localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled; document.getElementById('btnCam').innerHTML = localStream.getVideoTracks()[0].enabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash text-red-500"></i>'; }
        function endCall() { if(confirm("قطع تماس؟")) { if(call) call.close(); location.reload(); } }
    </script>
</body>
</html>
